name: CI

# Changes are made on branches and merged through pull requests; `main` is checked again after the
# merge. Branch protection requires the single "CI result" check. Documentation-only changes skip
# the heavy jobs inside the workflow rather than skipping the workflow: a workflow that never runs
# leaves a required check pending forever, a skipped job counts as passed.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the older run. Every commit on `main` gets its own run:
# a shared group would cancel or skip a pending one, leaving that commit unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repository. Checkouts do not keep the token either: dependency build
# scripts and the stand's containers run with the workspace mounted.
permissions:
  contents: read

env:
  # The lock file needs PHP >= 8.4.1 (Symfony 8); runners ship an older PHP, the image has 8.5.
  COMPOSER_IN_CONTAINER: '1'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Anything besides docs/, Markdown and LICENSE?
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # New branch or an unknown base: check everything.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a rename lists its old path too, so moving code under docs/ is a code change.
          git diff --name-only --no-renames "$BASE" "$GITHUB_SHA"
          code=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA" | grep -v -E '^docs/|\.md$|^LICENSE$' | head -1)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  module:
    name: Lint, formatting, module types and unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F nuxt-backend-lens dev:prepare
      - name: Lint and formatting (whole workspace)
        run: pnpm lint
      - run: pnpm -F nuxt-backend-lens test:types
      - run: pnpm -F nuxt-backend-lens test

  package:
    name: Packaged consumption
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:package

  stand:
    name: Stand — ${{ matrix.backend-mode }} / ${{ matrix.debug-backend }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The main target: Octane (FrankenPHP worker mode) with each debug package.
          - { backend-mode: octane, debug-backend: clockwork }
          - { backend-mode: octane, debug-backend: debugbar }
          # Baseline: a fresh bootstrap per request, isolates Octane-only problems.
          - { backend-mode: classic, debug-backend: clockwork }
    env:
      BACKEND_MODE: ${{ matrix.backend-mode }}
      DEBUG_BACKEND: ${{ matrix.debug-backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: demo/bin/setup
      # PHP formatting is the same in every configuration: checked once.
      - name: PHP formatting (Pint)
        if: matrix.backend-mode == 'octane' && matrix.debug-backend == 'clockwork'
        run: make pint-check
      - name: Backend tests (PHPUnit)
        working-directory: demo
        run: docker compose run --rm backend-tests
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the stand (docker compose, BACKEND_MODE=${{ matrix.backend-mode }})
        working-directory: demo
        run: docker compose up -d
      - run: demo/bin/wait 300
      - name: Worker isolation (leak test)
        run: pnpm test:leak --source=${{ matrix.debug-backend }} --requests=200 --concurrency=32
      - name: End-to-end (Playwright against the stand)
        run: pnpm test:e2e
      - name: Stand logs
        if: failure()
        working-directory: demo
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-${{ matrix.backend-mode }}-${{ matrix.debug-backend }}
          path: test-results/
          retention-days: 7

  # The one check branch protection requires: matrix jobs skipped as a whole would not report their
  # expanded names, so they cannot be required one by one.
  result:
    name: CI result
    if: always()
    needs: [changes, module, package, stand]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped for a documentation-only change
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
