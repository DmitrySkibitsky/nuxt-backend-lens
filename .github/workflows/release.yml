name: Release

# A `v*` tag on a commit of `main` publishes nuxt-backend-lens to npm through trusted publishing:
# npm trades the job's OIDC token for a short-lived one, so no npm token is stored, and attaches a
# provenance attestation. The release process: docs/development.md#releases.
on:
  push:
    tags: ['v*']

# One release at a time, and a publish is never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Dependency build scripts run here, so this job gets no publishing rights: only the publish job
  # can mint an OIDC token, and it installs nothing.
  build:
    name: Check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: The tag names the package version, on a commit of main
        run: |
          name=$(node -p "require('./packages/nuxt-backend-lens/package.json').name")
          version=$(node -p "require('./packages/nuxt-backend-lens/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: tag the release commit after its pull request is merged."
            exit 1
          fi
          # A prerelease (0.2.0-beta.1) must not become what `pnpm add` installs by default.
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          {
            echo "name=$name"
            echo "version=$version"
            echo "dist-tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
      # The tests ran on this very commit in ci.yml; the release only checks their result.
      - name: CI result passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20result" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" = 0 ]; then
            echo "::error::CI result has not passed on $GITHUB_SHA. Re-run this workflow once CI is green."
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          # The section changelogen wrote for this version: from its heading to the next one.
          awk -v heading="## v$VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            packages/nuxt-backend-lens/CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release/notes.md"; then
            echo "::error::packages/nuxt-backend-lens/CHANGELOG.md has no section for v$VERSION."
            exit 1
          fi
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache: a release builds only from the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Pack (prepack builds dist)
        working-directory: packages/nuxt-backend-lens
        run: pnpm pack --pack-destination "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm trusted publisher names this environment, so no other job can publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.build.outputs.name }}/v/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      # Node 24 ships npm 11.x; trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Publishes the tarball the build job packed, byte for byte. A version that is already on npm
      # (published by hand, or by an earlier run of this tag) is left alone, so the run can go on to
      # the GitHub release.
      - name: npm publish
        env:
          PACKAGE: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        # Asked anonymously: `npm view` would send the placeholder token setup-node configures.
        run: |
          npm --version
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PACKAGE/$VERSION")
          case "$status" in
            200)
              echo "::warning::$PACKAGE@$VERSION is already on npm; not publishing it again."
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::The npm registry answered $status for $PACKAGE@$VERSION."
              exit 1
              ;;
          esac
          npm publish release/*.tgz --provenance --tag "$DIST_TAG"

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          prerelease=$([ "$DIST_TAG" = next ] && echo true || echo false)
          gh release create "$GITHUB_REF_NAME" release/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release/notes.md \
            --prerelease="$prerelease"
